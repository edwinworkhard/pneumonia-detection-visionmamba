<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            background: #f8f9ff;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .threshold-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
        }
        .threshold-section h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 15px;
            background: white;
            border-radius: 20px;
            border: 2px solid #ddd;
            transition: all 0.2s ease;
        }
        .radio-group label:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        .radio-group input[type="radio"]:checked + span {
            color: #667eea;
            font-weight: bold;
        }
        .custom-threshold {
            display: none;
            margin-top: 10px;
        }
        .custom-threshold input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .submit-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }
        .file-info {
            margin-top: 15px;
            padding: 10px;
            background: #e8f5e8;
            border-radius: 5px;
            color: #2e7d32;
            font-weight: bold;
        }
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .info-box h4 {
            color: #1976d2;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🫁 肺炎检测系统</h1>
        
        <div class="info-box">
            <h4>📋 使用说明</h4>
            <p>请上传胸部X光图像，系统将使用AI模型检测是否可能存在肺炎。</p>
            <p>支持的图像格式：JPG、PNG、JPEG</p>
        </div>

        <form action="/predict" method="post" enctype="multipart/form-data" id="uploadForm">
            <div class="upload-area" onclick="document.getElementById('imageInput').click()">
                <p style="font-size: 18px; color: #667eea; font-weight: bold;">📸 点击选择图像或拖拽文件到此处</p>
                <input type="file" name="image" id="imageInput" accept="image/*" required>
                <button type="button" class="upload-btn">选择文件</button>
                <div id="fileInfo" class="file-info" style="display: none;"></div>
            </div>

            <div class="threshold-section">
                <h3>🔧 阈值设置</h3>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="threshold_mode" value="primary" checked>
                        <span>高敏感度模式 ({{ "%.1f"|format(primary*100) }}%)</span>
                    </label>
                    <label>
                        <input type="radio" name="threshold_mode" value="alt">
                        <span>平衡模式 ({{ "%.1f"|format(alt*100) }}%)</span>
                    </label>
                    <label>
                        <input type="radio" name="threshold_mode" value="custom">
                        <span>自定义阈值</span>
                    </label>
                </div>
                <div class="custom-threshold" id="customThresholdDiv">
                    <label>自定义阈值 (0.0-1.0): </label>
                    <input type="number" name="custom_threshold" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>

            <button type="submit" class="submit-btn">🚀 开始检测</button>
        </form>
    </div>

    <script>
        // 文件选择处理
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const fileInfo = document.getElementById('fileInfo');
            
            if (file) {
                fileInfo.style.display = 'block';
                fileInfo.innerHTML = `已选择: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                
                // 验证文件类型
                const validTypes = ['image/jpeg', 'image/jpg', 'image/png'];
                if (!validTypes.includes(file.type)) {
                    fileInfo.style.background = '#ffebee';
                    fileInfo.style.color = '#c62828';
                    fileInfo.innerHTML = '❌ 请选择JPG、JPEG或PNG格式的图像文件！';
                } else {
                    fileInfo.style.background = '#e8f5e8';
                    fileInfo.style.color = '#2e7d32';
                }
            } else {
                fileInfo.style.display = 'none';
            }
        });

        // 阈值模式切换
        document.querySelectorAll('input[name="threshold_mode"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const customDiv = document.getElementById('customThresholdDiv');
                if (this.value === 'custom') {
                    customDiv.style.display = 'block';
                } else {
                    customDiv.style.display = 'none';
                }
            });
        });

        // 拖拽上传
        const uploadArea = document.querySelector('.upload-area');
        
        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#764ba2';
            this.style.background = '#f0f2ff';
        });
        
        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.borderColor = '#667eea';
            this.style.background = '#f8f9ff';
        });
        
        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = '#667eea';
            this.style.background = '#f8f9ff';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('imageInput').files = files;
                const event = new Event('change', { bubbles: true });
                document.getElementById('imageInput').dispatchEvent(event);
            }
        });
    </script>
</body>
</html>
